name: Repository validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - run: docker build -t confidence-aware-visual-inspection:test .

  pytorch-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,ml]"
      - run: pytest tests/test_ml_contract.py
      - run: python -m ml.train --epochs 4 --samples-per-class 64
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-training-evidence
          path: |
            artifacts/metrics.json
            artifacts/synthetic-defect-cnn.pt
