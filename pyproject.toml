[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "confidence-aware-visual-inspection"
version = "1.0.0"
description = "A portfolio API demonstrating confidence-aware image-classification decisions."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "pillow==11.3.0",
  "python-multipart==0.0.20",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.8",
]
ml = [
  "torch==2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
